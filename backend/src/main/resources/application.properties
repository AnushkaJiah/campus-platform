spring.application.name=campus-platform

# ---- MySQL connection ----
spring.datasource.url=jdbc:mysql://localhost:3306/campus_platform?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ---- Server ----
server.port=8080

# ---- Auth (JWT) ----
# Secret must be at least 32 characters. Change it before any real deployment.
app.jwt.secret=campus-platform-dev-secret-change-me-0123456789
app.jwt.expiry-hours=12
